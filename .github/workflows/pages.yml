# Publica a versão de apresentação do site no GitHub Pages a cada envio para o main.
# O site fica em https://yan791.github.io/site_CM3/ (branch gh-pages).
# Nessa versão não há servidor: a Área do aluno mostra um aviso no lugar do login.
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependências
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Gerar o site
        working-directory: web
        run: npm run build:pages

      - name: Enviar para o branch gh-pages
        working-directory: web/dist-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publicar site (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
